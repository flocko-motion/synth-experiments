openapi: 3.1.0
info:
  title: Workspace API
  version: 0.1.0
  description: |
    Control the workspace mixer: transport (tempo, key, play/stop, seek),
    generators (add, remove, restart, volume, mute) and the click.

    Served by `ws daemon` on loopback (default `http://127.0.0.1:7700`); this
    spec is at `/api/openapi.yaml`.

    **Position grid.** Each level is four of the one below:
    tick (16th) → beat → bar → cycle (4 bars) → epoch (16 bars). Position
    fields count from 0 within their parent level; `text` is the 1-based
    DAW-style counter `epoch.cycle.bar.beat.tick`.

    **Live updates.** `GET /api/events` is a server-sent event stream with a
    `state` event about 20 times a second and a `log` event per log line.
    Prefer it to polling `/api/state`. To animate the position smoothly
    between events, extrapolate from `beat` and `bpm` while `playing`.

    **Effects.** Effects are pipe plugins with audio inputs, used in one of
    two roles:
    - **send**: its own bus. Every generator has a send amount (linear 0..1,
      post-fader) to every send effect, and the effect's `gain_db` is its
      return level into the mix. Send effects don't feed each other.
    - **insert**: in one generator's chain, in order, before its fader.
    Inserts add no latency: each block runs generators, then every chain's
    first insert in parallel, then the second, and so on, then send
    effects. An insert that is bypassed, restarting or late passes its input
    through unchanged. A send effect in that state returns silence.

    **Ducking.** Ducking is native to the mixer. Any generator that wants
    the others to duck emits duck events (psybass on every kick). Each
    source's events drive its own envelope: it jumps to the event's strength
    and recovers over about 0.6 of a beat. Sources add up softly,
    `1 - (1-a)(1-b)…`: they saturate below 1, and one at full strength is
    full ducking. Each plugin declares a default `duck_sensitivity` (0..1)
    and is turned down by `sensitivity × level`:
    - generators: by every *other* source combined (`duck_level`), never by
      their own; post-fader, before their sends;
    - send effects: the whole return;
    - insert effects: only what they add, `in + (out - in) × (1 - s × env)`,
      so a reverb insert ducks its tail and leaves the dry signal alone.
    Effects are ducked by the global level (`duck` in the state), which
    combines every source. Every generator's and effect's sensitivity is a
    mixer setting (`patchGenerator`, `patchEffect`), starting at the plugin's
    declared value and kept across restarts. All duck
    readings in the API are as heard, not `ahead_ms` early.

    **Entry.** A generator declares how it wants to come into a mix that's
    already playing (`entry`): `now`, `bar` (silent until the next bar
    line, for drums and bass) or `fade` over `bars` bars of playing time
    (quadratic, for pads). The mixer applies it after adding, before inserts
    and sends; its duck events are gated and faded with it. Neither moves
    while the transport is stopped. `addGenerator` can replace the declared
    entry, e.g. `{"mode": "now"}`. State is `entering` until it's fully in.

    **Latency.** The mixer renders ahead (`ahead_ms`), so a change is heard
    that long after the response.

    **Generators break.** A generator that crashes, hangs, garbles its output
    or produces NaN is restarted automatically; watch `state`, `restarts` and
    `last_error`. Its stderr (panics, debug prints) arrives as `log` events
    prefixed with `[name]`.

    **Access.** Only requests from local pages are accepted: `Host` must be
    the loopback address and `Origin`, if sent, `http://localhost:*`,
    `http://127.0.0.1:*` or `http://[::1]:*`. Cross-origin requests from
    such pages (for example a dev server) are allowed via CORS. Request
    bodies must be `application/json`.
servers:
  - url: http://127.0.0.1:7700

# No authentication: the API is loopback-only and checks Host and Origin
# (see Access above). The empty list says so explicitly.
security: []

paths:
  /api/state:
    get:
      operationId: getState
      summary: Transport, levels and all generators
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }

  /api/events:
    get:
      operationId: streamEvents
      summary: Live state and log (server-sent events)
      description: |
        `text/event-stream` with two event types:

        - `state`: `data` is a `State` object, about every 50 ms.
        - `log`: `data` is a `LogLine`; the event `id` is its `seq`. The
          most recent lines (up to 200) are replayed on connect.
      responses:
        "200":
          description: Event stream; stays open
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE frames carrying State (`event: state`) and LogLine (`event: log`) JSON."

  /api/transport:
    patch:
      operationId: patchTransport
      summary: Change tempo, key, play/stop, click, master level or the render-ahead buffer
      description: Only the fields given change. All are validated before any is applied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransportPatch" }
            examples:
              tempo: { value: { bpm: 150 } }
              key: { value: { root: "F#", scale: minor } }
              stop: { value: { playing: false } }
      responses:
        "200":
          description: State after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/transport/seek:
    post:
      operationId: seek
      summary: Jump to the start of a bar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bar]
              properties:
                bar:
                  type: integer
                  minimum: 1
                  description: Bar number from 1 (bar 17 = epoch 2).
      responses:
        "200":
          description: State after the seek
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/generators:
    get:
      operationId: listGenerators
      summary: Generators in the mix
      responses:
        "200":
          description: All generators, in the order they were added
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Generator" }
    post:
      operationId: addGenerator
      summary: Start a generator and add it to the mix
      description: |
        Give exactly one of `generator` (a name from `/api/catalog`) or
        `command`. Without `name`, one is derived from the generator or
        program (`psybass`, then `psybass-2`, `psybass-3`, …), so adds never
        collide. An explicit `name` that's taken is a 409.

        Responds once the generator has started and completed its handshake
        (up to 5 s). If that first start fails, nothing is added (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewGenerator" }
            examples:
              fromCatalog: { value: { generator: psybass, seed: 4 } }
              named: { value: { generator: percussion, name: drums, gain_db: -3 } }
              command: { value: { command: ["./my-gen.py", "--wild"] } }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generator" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/generators/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    patch:
      operationId: patchGenerator
      summary: Set a generator's volume, mute or send amounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneratorPatch" }
            examples:
              volume: { value: { gain_db: -6 } }
              mute: { value: { muted: true } }
              sends: { value: { sends: { pump: 0.4, echo: 0 } } }
      responses:
        "200":
          description: The generator after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generator" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      operationId: removeGenerator
      summary: Stop a generator and remove it
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/generators/{name}/params:
    parameters:
      - $ref: "#/components/parameters/Name"
    patch:
      operationId: setParams
      summary: Set a generator's parameters
      description: |
        Keys are parameter `id`s from the generator's `params`. Values are
        clamped to each parameter's range (integer, toggle and choice
        parameters snap to whole numbers); the response has the values
        actually used. Values are kept across restarts. While the generator
        is restarting, ids can't be checked and are stored as given.
        Changes apply from the next block; generators smooth them.

        With `glide_bars`, each value slides from where it is now to the
        new one over that many bars of the mixer's clock (tempo-synced;
        paused while the transport is stopped). Continuous params move
        linearly, `log` params evenly in ratio; integer, toggle and choice
        params switch at the end. `value` in the response and in the state
        follows the slide, so knobs can animate. A change without
        `glide_bars` jumps and stops any slide on that param.
      parameters:
        - $ref: "#/components/parameters/GlideBars"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: { type: number }
            examples:
              filter: { value: { cutoff: 0.5, resonance: 0.1 } }
      responses:
        "200":
          description: The generator after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generator" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/generators/{name}/inserts:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: addInsert
      summary: Add an insert effect to a generator's chain
      description: |
        Starts the effect and puts it into the generator's chain at
        `position` (default: last). Removing the generator removes its
        inserts. Naming works as for generators: names are shared between
        generators and effects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewEffect" }
            examples:
              duck: { value: { effect: duck, params: { depth: 0.9 } } }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Effect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/effects:
    get:
      operationId: listEffects
      summary: All effects, send and insert
      responses:
        "200":
          description: Effects, in the order they were added
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Effect" }
    post:
      operationId: addSendEffect
      summary: Add a send effect (its own bus)
      description: |
        Starts the effect as a send effect. Every generator can then send to
        it with `PATCH /api/generators/{name}` `{"sends": {"<effect>": 0.4}}`;
        its `gain_db` is the return level.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewEffect" }
            examples:
              pump: { value: { effect: duck, name: pump, gain_db: -6 } }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Effect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/effects/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    patch:
      operationId: patchEffect
      summary: Return level, mute, bypass, chain position or duck sensitivity
      description: "`gain_db` and `muted` apply to send effects (their return); `bypass` and `position` to inserts; `duck_sensitivity` to both."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EffectPatch" }
      responses:
        "200":
          description: The effect after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Effect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      operationId: removeEffect
      summary: Stop an effect and remove it
      description: Removes it from its chain, or drops every generator's send to it.
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/effects/{name}/params:
    parameters:
      - $ref: "#/components/parameters/Name"
    patch:
      operationId: setEffectParams
      summary: Set an effect's parameters
      description: Same rules as setParams, including `glide_bars`.
      parameters:
        - $ref: "#/components/parameters/GlideBars"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: { type: number }
      responses:
        "200":
          description: The effect after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Effect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/effects/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: restartEffect
      summary: Restart an effect now
      responses:
        "202":
          description: Restart scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Effect" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/generators/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: restartGenerator
      summary: Restart a generator now, e.g. after rebuilding it
      description: The restart happens in the background; watch `state` go from `starting` to `ok`.
      responses:
        "202":
          description: Restart scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generator" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/catalog:
    get:
      operationId: listCatalog
      summary: Generators available to add
      description: |
        Executables in the daemon's catalog directory (default
        `target/release`) that answer `--info` like gen-api generators. A
        newly built generator appears without restarting the daemon.
      responses:
        "200":
          description: Available generators, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogEntry" }

  /api/log:
    get:
      operationId: getLog
      summary: Recent log lines (the daemon keeps the last 1000)
      parameters:
        - name: after
          in: query
          description: Only lines with a higher `seq`.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Log lines, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogLine" }

components:
  parameters:
    GlideBars:
      name: glide_bars
      in: query
      required: false
      description: Slide to the new values over this many bars instead of jumping.
      schema: { type: number, exclusiveMinimum: 0, maximum: 64, examples: [1] }
    Name:
      name: name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/GeneratorName" }

  responses:
    BadRequest:
      description: Malformed body or a value out of range
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such generator (or catalog entry)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The name is taken
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: The generator didn't start (missing program, no `--pipe` support, failed handshake)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: The body wasn't sent as application/json
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Message for humans. }

    GeneratorName:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,32}$"
      description: Unique within the mix; `master` and `click` are reserved.

    Decibels:
      type: number
      minimum: -96
      maximum: 24
      description: Gain in dB; 0 is unity.

    Root:
      type: string
      description: Pitch class. Sharps or flats; returned with sharps.
      examples: ["C", "F#", "Bb"]

    Scale:
      type: string
      enum: [phrygian, minor, harmonic-minor, dorian, major]

    Peak:
      type: number
      minimum: 0
      maximum: 1
      description: Recent peak level (linear, after gain), falling back about 20 dB in 0.4 s. For meters.

    Position:
      type: object
      required: [epoch, cycle, bar, beat, tick, absolute_bar, text]
      properties:
        epoch: { type: integer, minimum: 0, description: "Epochs (16 bars) since 0; unbounded." }
        cycle: { type: integer, minimum: 0, maximum: 3, description: Cycle (4 bars) within the epoch. }
        bar: { type: integer, minimum: 0, maximum: 3, description: Bar within the cycle. }
        beat: { type: integer, minimum: 0, maximum: 3, description: Beat within the bar. }
        tick: { type: integer, minimum: 0, maximum: 3, description: 16th within the beat. }
        absolute_bar: { type: integer, minimum: 0, description: Bars since 0. }
        text: { type: string, examples: ["2.1.3.4.1"], description: "1-based counter epoch.cycle.bar.beat.tick." }

    State:
      type: object
      required: [playing, position, beat, bpm, root, scale, click, click_db, master_db, master_peak, duck, ahead_ms, latency_ms, latency_beats, underruns, sample_rate, generators, effects]
      properties:
        playing: { type: boolean }
        position: { $ref: "#/components/schemas/Position" }
        beat: { type: number, description: "Audible position in quarter notes since 0." }
        bpm: { type: number, minimum: 20, maximum: 300 }
        root: { $ref: "#/components/schemas/Root" }
        scale: { $ref: "#/components/schemas/Scale" }
        click: { type: boolean, description: Metronome on. }
        click_db: { $ref: "#/components/schemas/Decibels" }
        master_db: { $ref: "#/components/schemas/Decibels" }
        master_peak: { $ref: "#/components/schemas/Peak" }
        duck: { type: number, minimum: 0, maximum: 1, description: "The global duck level as heard now (its peak in the playing block): every source combined. Effects are ducked by this." }
        ahead_ms: { type: number, description: "Target size of the render-ahead buffer; set it with patchTransport." }
        latency_ms: { type: number, minimum: 0, description: "How far in the future a change lands right now: from what's playing to where the mixer renders next. Varies around ahead_ms; the audio device's own few ms come on top." }
        latency_beats: { type: number, minimum: 0, description: "latency_ms in beats at the current tempo." }
        underruns: { type: integer, minimum: 0, description: "Times the audio device found the buffer empty (audible glitches)." }
        sample_rate: { type: integer }
        generators:
          type: array
          items: { $ref: "#/components/schemas/Generator" }
        effects:
          type: array
          items: { $ref: "#/components/schemas/Effect" }

    TransportPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        playing: { type: boolean, description: "false stops the transport; sounding voices ring out." }
        bpm: { type: number, minimum: 20, maximum: 300 }
        root: { $ref: "#/components/schemas/Root" }
        scale: { $ref: "#/components/schemas/Scale" }
        click: { type: boolean }
        click_db: { $ref: "#/components/schemas/Decibels" }
        master_db: { $ref: "#/components/schemas/Decibels" }
        ahead_ms:
          type: number
          minimum: 20
          maximum: 2000
          description: "Render-ahead buffer target: how far in the future changes land. Smaller is more responsive but leaves less margin before dropouts (watch underruns). Shrinking takes effect as the buffer drains; nothing is cut. The maximum is 2000 ms, or the daemon's --ahead if that was larger."

    GeneratorState:
      type: string
      description: |
        - `ok`: running and on time
        - `late`: running but missing deadlines (its blocks play as silence)
        - `nan`: producing NaN/inf (silenced; restarted if it persists)
        - `muted`: running, muted
        - `entering`: just added, waiting for the bar line or fading in (see `entry`)
        - `starting`: a restart is in progress
        - `retry 1.2s`: waiting to restart after a failure (pattern `retry <seconds>s`)
      examples: [ok, late, nan, muted, entering, starting, "retry 1.2s"]

    Generator:
      type: object
      required: [name, command, description, category, channels, inputs, params, gain_db, muted, state, late, restarts, peak, last_error, duck_sensitivity, declared_duck_sensitivity, duck_source, duck_level, entry, inserts, sends]
      properties:
        name: { $ref: "#/components/schemas/GeneratorName" }
        command:
          type: array
          items: { type: string }
          description: Program and arguments (without the `--pipe` the workspace appends).
        description:
          type: string
          description: From the generator itself; empty while not running.
        category:
          description: From the generator; null while not running.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Category"
        channels:
          type: [integer, "null"]
          description: 1 (mono) or 2 (stereo); null while not running.
        inputs:
          type: [integer, "null"]
          description: Input channels; always 0 for generators (effects are in `effects`). Null while not running.
        params:
          type: array
          items: { $ref: "#/components/schemas/Param" }
          description: The running generator's parameters with current values; empty while not running.
        gain_db: { $ref: "#/components/schemas/Decibels" }
        muted: { type: boolean }
        state: { $ref: "#/components/schemas/GeneratorState" }
        late: { type: integer, minimum: 0, description: Blocks played as silence because output was late. }
        restarts: { type: integer, minimum: 0 }
        peak: { $ref: "#/components/schemas/Peak" }
        last_error:
          oneOf:
            - type: "null"
            - type: object
              required: [message, seconds_ago]
              properties:
                message: { type: string, examples: ["hung (no output for 1s)", "exited", "garbled output (something printed to stdout?)"] }
                seconds_ago: { type: number }
        duck_sensitivity: { $ref: "#/components/schemas/DuckSensitivity" }
        declared_duck_sensitivity:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: The generator's own default. Null while not running.
        duck_source: { type: number, minimum: 0, maximum: 1, description: "How much this generator is ducking the others right now (its own duck events' envelope, as heard)." }
        duck_level: { type: number, minimum: 0, maximum: 1, description: "How much the other generators are ducking it right now, before its sensitivity. The gain reduction is duck_sensitivity × duck_level." }
        entry:
          description: How it comes into the mix when added, as asked in addGenerator or else as declared; null while not running.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Entry"
        inserts:
          type: array
          items: { $ref: "#/components/schemas/GeneratorName" }
          description: Insert effects (names in `effects`), in signal order.
        sends:
          $ref: "#/components/schemas/Sends"

    Param:
      type: object
      required: [id, name, min, max, default, kind, log, unit, value]
      properties:
        id: { type: string, description: "Stable key; use it in setParams." }
        name: { type: string, description: For humans. }
        min: { type: number }
        max: { type: number }
        default: { type: number }
        kind:
          type: string
          enum: [continuous, integer, toggle, choice]
          description: "toggle: 0 or 1. choice: an index into `labels`."
        log: { type: boolean, description: "Display hint: use a logarithmic scale (frequencies)." }
        unit: { type: string, examples: ["Hz", "oct", "dB", ""] }
        labels:
          type: array
          items: { type: string }
          description: Only for `choice`.
        value: { type: number, description: "The value in use now (clamped); mid-slide, where the slide currently is." }

    NewGenerator:
      type: object
      additionalProperties: false
      description: Exactly one of `generator` and `command`.
      properties:
        name: { $ref: "#/components/schemas/GeneratorName" }
        generator: { type: string, description: "A `name` from /api/catalog." }
        command:
          type: array
          minItems: 1
          items: { type: string }
          description: Program and arguments; relative paths resolve against the daemon's directory.
        seed: { type: integer, minimum: 0, description: "Appended as `--seed N`." }
        gain_db: { $ref: "#/components/schemas/Decibels" }
        muted: { type: boolean }
        entry:
          $ref: "#/components/schemas/Entry"
          description: Replaces the generator's declared entry for this add.
        duck_sensitivity: { type: number, minimum: 0, maximum: 1, description: "Replaces the generator's declared value." }
      oneOf:
        - required: [generator]
        - required: [command]

    GeneratorPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        gain_db: { $ref: "#/components/schemas/Decibels" }
        muted: { type: boolean }
        duck_sensitivity: { type: number, minimum: 0, maximum: 1, description: "How much the others' ducking turns this channel down; replaces the generator's declared value." }
        sends:
          type: object
          description: Send amounts to set, by send-effect name; 0 or null removes. Others are unchanged.
          additionalProperties:
            oneOf:
              - type: "null"
              - { type: number, minimum: 0, maximum: 1 }

    Category:
      type: string
      description: |
        What kind of plugin, declared by the plugin, for grouping and sorting.
        A short lowercase word; `other` if the plugin doesn't say. Known ones,
        in display order: generators `drums`, `bass`, `lead`, `pad`, `fx`;
        effects `dynamics`, `filter`, `distortion`, `modulation`, `delay`,
        `reverb`; then `other`. Sort unknown ones after the known ones.
      examples: [drums, bass, pad, reverb]

    Entry:
      type: object
      additionalProperties: false
      required: [mode]
      description: How a generator comes into a mix that's playing.
      properties:
        mode:
          type: string
          enum: [now, bar, fade]
          description: "now: straight away. bar: silent until the next bar line. fade: fades in over `bars`."
        bars: { type: number, exclusiveMinimum: 0, maximum: 64, description: "fade only: length in bars of playing time." }
      examples:
        - { mode: bar }
        - { mode: fade, bars: 4 }

    DuckSensitivity:
      type: [number, "null"]
      minimum: 0
      maximum: 1
      description: "In use: the mixer's setting if one was made, else the plugin's declared value (the kick is 0, pads high). Null while not running and not set."

    Sends:
      type: object
      description: Post-fader send amounts (linear 0..1) by send-effect name. Absent means 0.
      additionalProperties: { type: number, minimum: 0, maximum: 1 }

    Effect:
      type: object
      required: [name, command, description, category, role, owner, channels, inputs, params, gain_db, muted, bypass, state, late, restarts, peak, last_error, duck_sensitivity, declared_duck_sensitivity]
      properties:
        name: { $ref: "#/components/schemas/GeneratorName" }
        command: { type: array, items: { type: string } }
        description: { type: string }
        category:
          description: From the effect; null while not running.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Category"
        role:
          type: string
          enum: [send, insert]
        owner:
          type: [string, "null"]
          description: Inserts only, the generator whose chain it's in.
        channels: { type: [integer, "null"] }
        inputs: { type: [integer, "null"] }
        params:
          type: array
          items: { $ref: "#/components/schemas/Param" }
        gain_db:
          $ref: "#/components/schemas/Decibels"
        muted: { type: boolean }
        bypass: { type: boolean, description: Inserts only. }
        duck_sensitivity:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: In use. The mixer's setting if one was made, else the plugin's declared value. Sends duck their whole return; inserts only what they add.
        declared_duck_sensitivity:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: The plugin's own default. Null while not running.
        state: { $ref: "#/components/schemas/GeneratorState" }
        late: { type: integer, minimum: 0 }
        restarts: { type: integer, minimum: 0 }
        peak: { $ref: "#/components/schemas/Peak" }
        last_error:
          oneOf:
            - type: "null"
            - type: object
              required: [message, seconds_ago]
              properties:
                message: { type: string }
                seconds_ago: { type: number }

    NewEffect:
      type: object
      additionalProperties: false
      description: Exactly one of `effect` and `command`.
      properties:
        name: { $ref: "#/components/schemas/GeneratorName" }
        effect: { type: string, description: "A `name` from /api/catalog with kind effect." }
        command: { type: array, minItems: 1, items: { type: string } }
        seed: { type: integer, minimum: 0 }
        params:
          type: object
          additionalProperties: { type: number }
          description: Initial parameter values by id.
        gain_db: { $ref: "#/components/schemas/Decibels" }
        muted: { type: boolean }
        position: { type: integer, minimum: 0, description: "Inserts: index in the chain, 0 = first; default last." }
        duck_sensitivity: { type: number, minimum: 0, maximum: 1, description: "Replaces the plugin's declared value." }
      oneOf:
        - required: [effect]
        - required: [command]

    EffectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        gain_db: { $ref: "#/components/schemas/Decibels" }
        muted: { type: boolean }
        bypass: { type: boolean, description: Inserts only. }
        position: { type: integer, minimum: 0, description: "Inserts only: move to this index." }
        duck_sensitivity: { type: number, minimum: 0, maximum: 1, description: "How much the kick ducks this effect; replaces the plugin's declared value." }

    CatalogEntry:
      type: object
      required: [name, kind, description, category, channels, inputs, params, duck_sensitivity, entry, path]
      properties:
        name: { type: string, description: "Pass as `generator` to addGenerator, or as `effect` to addSendEffect/addInsert." }
        kind: { type: string, enum: [generator, effect] }
        description: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        channels: { type: integer }
        inputs: { type: integer, description: Non-zero for effects. }
        duck_sensitivity: { type: number, minimum: 0, maximum: 1 }
        entry: { $ref: "#/components/schemas/Entry" }
        params:
          type: array
          description: Parameter descriptions (defaults, no current values).
          items:
            type: object
            required: [id, name, min, max, default, kind, log, unit]
            properties:
              id: { type: string }
              name: { type: string }
              min: { type: number }
              max: { type: number }
              default: { type: number }
              kind: { type: string, enum: [continuous, integer, toggle, choice] }
              log: { type: boolean }
              unit: { type: string }
              labels: { type: array, items: { type: string } }
        path: { type: string }

    LogLine:
      type: object
      required: [seq, line]
      properties:
        seq: { type: integer, description: Increasing; use as `after` to fetch only newer lines. }
        line: { type: string, examples: ["[psybass] bars 9-16 rolling K B B B"] }
