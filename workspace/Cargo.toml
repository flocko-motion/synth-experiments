[package]
name = "workspace"
version = "0.1.0"
edition = "2021"
description = "Global workspace mixer: clock, click and generator subprocesses"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
gen-api = { path = "../crates/gen-api" }
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
